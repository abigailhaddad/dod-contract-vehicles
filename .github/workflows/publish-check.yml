name: Publish scope check

# Guards the Cloudflare Pages deployment: publish directory is web/, nothing
# but the website is in it, and no published file exceeds the hard 25 MiB
# per-file limit. Runs on every push/PR because a bad commit is the thing
# that breaks a deploy -- the weekly data pipeline runs too late to catch it.

on:
  push:
    branches: [main, prod]
  pull_request:
  workflow_dispatch:

jobs:
  publish-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest pyyaml

      - name: Check publish scope and file sizes
        run: pytest tests/test_publish.py -v

      # The payload encoding is what keeps vehicles.json + families.json at
      # ~14 MB instead of 127 MB, and it only works while payload.py and the
      # decoders in web/index.html agree. Both halves are in the repo, so this
      # runs on a bare checkout; the size assertions skip without web/data/
      # and run in the pipeline's test job instead.
      - name: Check payload encoding
        run: pytest tests/test_payload.py -v
